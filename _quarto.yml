project:
  type: website
  output-dir: docs
  render:
    - reports/overview.qmd
    - reports/analysis.qmd
    - reports/data-dictionary.qmd
    - reports/methodology.qmd
  resources:
    - reports/scripts/site.js

website:
  title: "Island Time, Interrupted"
  # description: ""
  # site-url: "https://johbry17.github.io/Island-Time-Interrupted/"
  favicon: images/favicon.ico
  open-graph: true
  twitter-card: true
  back-to-top-navigation: true
  navbar:
    left:
      - href: reports/overview.qmd
        text: "Overview"
      - href: reports/analysis.qmd
        text: "Analysis"
      - href: reports/data-dictionary.qmd
        text: "Data"
      - href: reports/methodology.qmd
        text: "Methods"
    right:
      - icon: github
        href: https://github.com/johbry17/Island-Time-Interrupted
  page-footer:
    left: "Data sources: World Bank, Our World in Data"
    center: "© <span id='copyright-year'>2026</span> Bryan C. Johns"
    right:
      - text: Portfolio
        href: https://informedwanderer.com
      - text: LinkedIn
        href: https://www.linkedin.com/in/b-johns/
      - text: GitHub
        href: https://github.com/johbry17

format:
  html:
    author-meta: "Bryan C. Johns"
    theme: 
      light: [cosmo, themes/archipelago-light.scss]
      dark: [darkly, themes/archipelago-dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    df-print: kable
    code-fold: true
    code-tools: false
    fig-format: png
    fig-dpi: 150
    embed-resources: false
    smooth-scroll: true
    include-after-body: # site.js for copyright year & back-to-top smooth scroll
      - text: |
          <script src="scripts/site.js"></script>

execute:
  warning: false
  message: false
  freeze: auto

editor: source
