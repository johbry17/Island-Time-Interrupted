project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - analysis.qmd
    - data-dictionary.qmd
    - methodology.qmd

author: "Bryan C. Johns"

website:
  title: "Island Time, Interrupted"
  favicon: "images/favicon.ico"
  navbar:
    left:
      - href: index.qmd
        text: "Field Note"
      - href: analysis.qmd
        text: "Analysis"
      - href: data-dictionary.qmd
        text: "Data"
      - href: methodology.qmd
        text: "Methodology"
    right:
      - icon: github
        href: https://github.com/johbry17/Island-Time-Interrupted

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    df-print: kable
    code-fold: true
    code-tools: false
    fig-format: png
    fig-dpi: 150
    embed-resources: false

execute:
  warning: false
  message: false
  cache: true

editor: source
