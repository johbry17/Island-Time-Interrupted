project:
  type: website
  output-dir: docs
  render:
    - index.qmd

website:
  title: "Island Time, Interrupted"
  navbar:
    left:
      - href: index.qmd
        text: "Tourism & COVID"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    df-print: kable
    code-fold: true
    code-tools: false
    fig-format: png
    fig-dpi: 150
    embed-resources: false

execute:
  warning: false
  message: false
  cache: true

editor: source
