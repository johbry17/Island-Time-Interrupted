project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - analysis.qmd
    - data-dictionary.qmd
    - methodology.qmd

website:
  title: "Island Time, Interrupted"
  favicon: "images/favicon.ico"
  navbar:
    left:
      - href: index.qmd
        text: "Overview"
      - href: analysis.qmd
        text: "Analysis"
      - href: data-dictionary.qmd
        text: "Data"
      - href: methodology.qmd
        text: "Methods"
    right:
      - icon: github
        href: https://github.com/johbry17/Island-Time-Interrupted
  page-footer:
    left: "Data sources: World Bank, Our World in Data"
    center: "© {{< current-year >}} Bryan C. Johns"
    right:
      - text: Portfolio
        href: https://informedwanderer.com
      - text: LinkedIn
        href: https://www.linkedin.com/in/b-johns/
      - text: GitHub
        href: https://github.com/johbry17

format:
  html:
    author-meta: "Bryan C. Johns"
    shortcodes: 
      - year.lua
    theme: [cosmo, styles.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    number-sections: false
    df-print: kable
    code-fold: true
    code-tools: false
    fig-format: png
    fig-dpi: 150
    # fig-cap-location: bottom
    embed-resources: false

execute:
  warning: false
  message: false
  freeze: auto

editor: source
